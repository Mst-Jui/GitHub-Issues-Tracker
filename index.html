<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- title name  -->
  <title>GitHub Issues Tracker | Login</title>

  <!-- google font  -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
   
   <!-- tailwind & daisyui & style.css  -->
   <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>
<body>
  <!-- login form  -->
  <section class="shadow-md bg-white rounded-lg w-sm mx-auto mt-10 p-6">
    <!-- GitHub Issues Tracker  -->
 <div class="flex flex-col gap-6 items-center pt-7 mx-auto w-xs">
  <img src="./assets/github-logo.png" alt="github-logo">
   <div class="space-y-1 text-center">
    <h2 class="text-2xl font-semibold text-[#1F2937]">GitHub Issues Tracker</h2>
    <p class="text-[#64748B]">Sign in to manage your issues</p>
   </div>
  </div>

<!-- login section  -->
<div class=" w-xs flex flex-col items-center justify-center mt-4 mx-auto">
  <fieldset class="fieldset w-xs p-4">

  <label class="label text-[#1F2937] font-medium text-[16px]">Username</label>
  <input id="user-name" type="text" class="input text-[#64748B]" placeholder="Enter Username" />
  <p class="text-[14px] text-[#4A00FF]">Default: admin</p>

  <label class="label text-[16px]">Password</label>
  <input id="password" type="password" class="input" placeholder="Enter Password" />
  <p class="text-[14px] text-[#4A00FF]">Default: admin123</p>

  <button id="login-btn" class="btn btn-primary mt-4 font-semibold">Sign In</button>
</fieldset>
</div>

<!-- admin password  -->
 <div class="mx-auto w-xs">
  <div class="flex justify-center items-center w-11/12 mx-auto mt-6">
    <hr class="border-gray-300 w-xs">
    <p class="px-4 text-gray-500">OR</p>
    <hr class="border-gray-300 w-xs">
  </div>
  <div>
    <p class="text-gray-400 text-center mt-5">Demo Credentials:</p>
    <div class="bg-gray-100 mx-auto my-5 py-8 text-center">
      <p> <span class="font-semibold">Username</span>: admin</p>
      <p><span class="font-semibold">Password</span>: admin123</p>
    </div>
  </div>
 </div>

  </section>
 
  <script src="./login.js"></script>
</body>
</html>
